name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      # Public CI never depends on the original, private camera fixture.
      FLICKER_TEST_RAW: /tmp/flicker-ci-no-private-fixture.ARW
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked core and test dependencies
        run: uv sync --locked --extra dev
      - name: Run public tests without the optional scene dependency
        run: uv run --no-sync pytest -q
      - name: Check installed command
        run: uv run --no-sync flicker-removal --version

  scene:
    name: Optional scene refinement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLICKER_TEST_RAW: /tmp/flicker-ci-no-private-fixture.ARW
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra scene
      - name: Confirm the optional dependency is installed
        run: uv run --no-sync python -c 'import cv2; print(cv2.__version__)'
      - run: uv run --no-sync pytest -q

  package:
    name: Build and installed distribution smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - name: Verify lock and exported requirements
        run: |
          uv lock --check
          uv export --locked --extra dev --extra scene --format requirements-txt --no-hashes --no-emit-project --output-file requirements-lock.txt
          git diff --exit-code -- uv.lock requirements-lock.txt
      - name: Check maintained Python formatting
        run: |
          uv sync --locked --extra dev
          uv run --no-sync ruff format --check src tests scripts .github/scripts
      - name: Build the wheel from the source distribution
        run: uv build --no-sources
      - name: Check archive contents and metadata
        run: uv run --no-project python .github/scripts/check_distributions.py dist
      - name: Smoke test installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python -m flicker_removal --help
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl flicker-removal --version
      - name: Smoke test installed source distribution outside the source tree
        working-directory: ${{ runner.temp }}
        run: uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.tar.gz python -m flicker_removal --version
